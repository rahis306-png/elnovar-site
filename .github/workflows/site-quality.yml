name: Static site quality gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify site structure, local links and launch copy
        env:
          SITE_HOST: elnovargroup.co.uk
        run: node scripts/audit-site.mjs

      - name: Self-test SEO guard with negative fixtures
        run: node scripts/seo-regressions.mjs --self-test

      - name: Enforce sitemap parity, metadata uniqueness and deliberate indexability
        env:
          SITE_HOST: elnovargroup.co.uk
          SITE_SITEMAP_EXPECTED: "7"
          SITE_EXPECT_NOINDEX: "no"
        run: node scripts/seo-regressions.mjs

      - name: Check browser JavaScript syntax
        run: |
          node --check script.js
          node --check enquiry-live.js
