name: Static site quality gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify site structure, local links and launch copy
        env:
          SITE_HOST: elnovargroup.co.uk
        run: node scripts/audit-site.mjs
